<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ad‑Aware Screen Reader – Options</title>
  <style>
    body{font-family:system-ui,Arial; margin:20px; max-width:720px}
    textarea{width:100%; height:160px}
    code{background:#f4f4f4; padding:2px 4px}
  </style>
</head>
<body>
  <h2>Skip selectors</h2>
  <p>One CSS selector per line. Any element matching <strong>or inside</strong> these selectors will be ignored when reading/analysis.</p>
  <textarea id="selectors"></textarea>
  <div>
    <button id="save">Save</button>
    <span id="status"></span>
  </div>
  <p><small>Examples: <code>.ad, .sponsored, [aria-label*="advert"]</code></small></p>
  <script src="options.js"></script>
</body>
</html>
