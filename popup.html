<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ad‑Aware Screen Reader</title>
  <style>
    body{font-family:system-ui,Arial; margin:12px; width:360px}
    label{display:block; margin:8px 0}
    input[type=range]{width:100%}
    button{width:100%; padding:8px; margin:6px 0}
    small{color:#555}
  </style>
</head>
<body>
  <button id="analyze">Analyze & Highlight (Alt+A)</button>
  <button id="readMain">Read main content (Alt+R)</button>
  <button id="readSel">Read selection</button>
  <button id="pause">Pause/Resume (Alt+P)</button>
  <button id="stop">Stop (Alt+S)</button>

  <hr/>
  <label>Rate <input id="rate" type="range" min="0.5" max="2.0" step="0.1"></label>
  <label>Pitch <input id="pitch" type="range" min="0.5" max="2.0" step="0.1"></label>
  <label>Volume <input id="volume" type="range" min="0.1" max="1.0" step="0.1"></label>
  <label>Voice <select id="voice"></select></label>
  <label><input id="useChromeTTS" type="checkbox"> Use chrome.tts (requires additional permission)</label>
  <small>Tip: Use the Options page to add site-specific ad selectors.</small>

  <script src="popup.js"></script>
</body>
</html>
